name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rayneo/**'
      - 'tests/**'
      - 'tools/build_windows*'
      - 'RayNeo_Log_Tool.py'
      - 'requirements.txt'
      - '异常判定规则.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install application and build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and smoke-test the Windows EXE
        run: python tools/build_windows.py
      - name: Upload portable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: RayNeo-Log-Tool-Windows-x64
          path: dist/RayNeo_Log_Tool/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            dist/build-smoke-test.json
            build/RayNeo_Log_Tool/warn-RayNeo_Log_Tool.txt
          if-no-files-found: ignore
          retention-days: 7
